<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BryantOS">
  <meta name="robots" content="noindex, nofollow">
  <title>BryantOS</title>
  <link rel="stylesheet" href="styles.css?v=2">
  <link rel="icon" href="logo.png" type="image/png">
  <link rel="apple-touch-icon" sizes="512x512" href="logo.png">
  <link rel="manifest" href="manifest.webmanifest">

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <!-- Only used once, to upgrade items saved by the old PIN Vault -->
  <script src="crypto-js.min.js"></script>
  <script src="vault.js?v=2"></script>
</head>
<body>
  <div class="app" id="app" hidden>

    <!-- Side menu (computer) -->
    <nav class="sidebar" aria-label="Main">
      <div class="brand">
        <img src="logo.png" alt="" class="brand-logo">
        <div class="brand-text">
          <span class="brand-name">BryantOS</span>
          <span class="brand-sub">Your private stuff</span>
        </div>
      </div>

      <div class="nav-group">
        <button type="button" class="nav-btn" data-act="go" data-sec="home">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home
        </button>
        <button type="button" class="nav-btn" data-act="go" data-sec="notes">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/></svg>Notes
        </button>
        <button type="button" class="nav-btn" data-act="go" data-sec="photos">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>Photos &amp; docs
        </button>
        <button type="button" class="nav-btn" data-act="go" data-sec="links">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Links
        </button>
        <button type="button" class="nav-btn" data-act="go" data-sec="vault">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Vault
          <span class="nav-tag" data-vault-tag>Locked</span>
        </button>
      </div>

      <div class="nav-group">
        <span class="nav-label">More</span>
        <button type="button" class="nav-btn" data-act="go" data-sec="more">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Money, bills &amp; dates
        </button>
        <button type="button" class="nav-btn" data-act="go" data-sec="settings">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings &amp; folders
        </button>
      </div>

      <div class="user-card">
        <img class="user-avatar" data-user-photo alt="" hidden>
        <div class="user-initial" data-user-initial>?</div>
        <div class="user-text">
          <span class="user-name" data-user-name></span>
          <span class="user-sub">Signed in with Google</span>
        </div>
      </div>
    </nav>

    <!-- Main area -->
    <div class="main-wrap">
      <!-- Phone header -->
      <header class="phone-header">
        <img src="logo.png" alt="" class="brand-logo">
        <span class="brand-name">BryantOS</span>
        <button type="button" class="icon-btn" data-act="go" data-sec="more" aria-label="Money, bills and dates">
          <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
        </button>
        <button type="button" class="icon-btn" data-act="go" data-sec="settings" aria-label="Settings and folders">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        </button>
      </header>

      <main class="main" id="main">
        <div class="topbar">
          <div class="search">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <label class="sr" for="search">Search everything</label>
            <input id="search" type="search" placeholder="Search notes, links, photos…" autocomplete="off">
          </div>
          <button type="button" class="btn btn-primary" data-act="new">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New
          </button>
          <button type="button" class="btn" data-act="vault-lock" data-lock-btn hidden>
            <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Lock now
          </button>
        </div>

        <div class="banner banner-error" id="syncError" role="alert" hidden>
          Can't reach the cloud right now. Changes are kept on this device and will sync when you're back online.
        </div>

        <div class="chips" id="chips" role="group" aria-label="Filter by folder"></div>

        <section id="view" aria-live="polite"></section>
      </main>
    </div>

    <!-- Bottom menu (phone) -->
    <nav class="bottom-nav" aria-label="Main">
      <button type="button" data-act="go" data-sec="home"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
      <button type="button" data-act="go" data-sec="notes"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>Notes</button>
      <button type="button" data-act="go" data-sec="photos"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>Photos</button>
      <button type="button" data-act="go" data-sec="links"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Links</button>
      <button type="button" data-act="go" data-sec="vault"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Vault</button>
    </nav>

    <div class="toast" id="toast" role="status" hidden></div>
  </div>

  <div class="loading" id="loading">Loading BryantOS…</div>

  <script src="app.js?v=2"></script>
</body>
</html>
